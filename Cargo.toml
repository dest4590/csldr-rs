[package]
name = "csldr"
version = "0.1.0"
edition = "2021"

[lib]
name = "client"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
