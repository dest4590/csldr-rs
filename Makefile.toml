[tasks.build]
clear = true
dependencies = ["cargo-build-release", "deploy"]

[tasks.build-debug]
clear = true
dependencies = ["cargo-build-debug", "deploy"]

[tasks.cargo-build-release]
command = "cargo"
args = ["build", "--release"]

[tasks.cargo-build-release.linux]
command = "cargo"
args = ["build", "--release", "--target", "i686-unknown-linux-gnu"]

[tasks.cargo-build-release.windows]
command = "cargo"
args = ["build", "--release", "--target", "i686-pc-windows-msvc"]

[tasks.cargo-build-debug]
command = "cargo"
args = ["build"]

[tasks.cargo-build-debug.linux]
command = "cargo"
args = ["build", "--target", "i686-unknown-linux-gnu"]

[tasks.cargo-build-debug.windows]
command = "cargo"
args = ["build", "--target", "i686-pc-windows-msvc"]

[tasks.cargo-build-windows]
command = "cargo"
args = ["build", "--release", "--target", "i686-pc-windows-msvc"]

[tasks.cargo-build-windows-gnu]
command = "cargo"
args = ["build", "--release", "--target", "i686-pc-windows-gnu"]

[tasks.cargo-build-linux]
command = "cargo"
args = ["build", "--release", "--target", "i686-unknown-linux-gnu"]

[tasks.deploy]
command = "cargo"
args = ["run", "--bin", "deploy"]

[tasks.install-win]
clear = true
dependencies = ["cargo-build-windows", "deploy"]

[tasks.install-linux]
clear = true
dependencies = ["cargo-build-linux", "deploy"]
